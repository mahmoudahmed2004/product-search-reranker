[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-search-reranker"
version = "0.2.0"
readme = "README.md"
description = "BM25 and LambdaRank reranking on Amazon ESCI shopping queries"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165,<1",
    "lightgbm>=4.6,<5",
    "numpy>=1.26,<3",
    "pyarrow>=19,<27",
    "pydantic>=2.9,<3",
    "scikit-learn>=1.5,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
store = ["qdrant-client[fastembed]>=1.20,<2"]
dev = ["build>=1.2", "httpx2>=2.16.2,<3", "pytest>=8", "ruff>=0.11", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
